<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درب | الصنف</title>
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#14120f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="images/logo-sand.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <div class="nav">
    <a href="index.html" class="logo"><img class="logo-img" src="images/logo-sand.svg" alt="درب"></a>
    <nav class="nav-links">
      <a href="index.html#wholesale">الجملة</a>
      <a href="index.html#retail">المفرق</a>
      <a href="index.html#shipping">الشحن</a>
      <a href="index.html#contact" class="nav-cta">تواصل معنا</a>
    </nav>
  </div>
</header>

<section class="cat-hero">
  <div class="wrap">
    <span class="crumb" id="crumb"></span>
    <h1 id="m-title">تحميل...</h1>
    <p id="m-sub">اضغطوا على السعر لطلب الصنف عبر واتساب</p>
  </div>
</section>

<section style="padding-top:70px">
  <div class="wrap">
    <div class="products" id="photos"></div>
    <p style="text-align:center;margin-top:30px"><a id="back" href="index.html" style="color:var(--gold);font-weight:700">← العودة إلى القسم</a></p>
  </div>
</section>

<footer>
  <div class="logo"><img class="logo-img" src="images/logo-sand.svg" alt="درب"></div>
  <p>أحذية بالجملة والمفرق · حلب، سوريا</p>
  <p style="margin-top:10px">© 2026 درب. جميع الحقوق محفوظة</p>
</footer>

<a class="float-wa" id="float-wa" href="#" target="_blank" rel="noopener" aria-label="واتساب">💬</a>

<script src="catalog.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const section = params.get('s') === 'retail' ? 'retail' : 'wholesale';
  const index = parseInt(params.get('c'), 10) || 0;
  const mi = parseInt(params.get('m'), 10) || 0;
  const label = section === 'retail' ? 'المفرق' : 'الجملة';
  const cat = (CATALOG[section] || [])[index];
  const item = cat ? cat.items[mi] : null;

  document.getElementById('float-wa').href = waLink();

  if (!item) {
    document.getElementById('m-title').textContent = 'الصنف غير موجود';
    document.getElementById('m-sub').textContent = 'يمكنكم العودة إلى الصفحة الرئيسية.';
  } else {
    document.title = 'درب | ' + cat.name + ' ' + label;
    document.getElementById('crumb').textContent = label + ' · ' + cat.name;
    document.getElementById('m-title').textContent = cat.name;
    document.getElementById('back').href = 'category.html?s=' + section + '&c=' + index;

    const wrap = document.getElementById('photos');
    item.photos.forEach((src, p) => {
      const card = document.createElement('div');
      card.className = 'product reveal' + (p % 3 === 1 ? ' d1' : p % 3 === 2 ? ' d2' : '');

      const pimg = document.createElement('div');
      pimg.className = 'pimg';
      pimg.appendChild(makeImg(src, cat.name, 'صورة قريباً'));
      card.appendChild(pimg);

      const body = document.createElement('div');
      body.className = 'pbody';
      const price = document.createElement('a');
      price.className = 'ask-btn';
      price.href = waLink(priceMsg(src));
      price.target = '_blank';
      price.rel = 'noopener';
      price.textContent = item.price || 'السعر عند التواصل';
      body.appendChild(price);
      card.appendChild(body);
      wrap.appendChild(card);
    });
  }

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  const header = document.querySelector('header');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 40));
</script>
</body>
</html>
