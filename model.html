<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درب | الموديل</title>
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#14120f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="images/logo-sand.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <div class="nav">
    <a href="index.html" class="logo"><img class="logo-img" src="images/logo-sand.svg" alt="درب"></a>
    <nav class="nav-links">
      <a href="index.html#wholesale">الجملة</a>
      <a href="index.html#retail">المفرق</a>
      <a href="index.html#shipping">الشحن</a>
      <a href="index.html#contact" class="nav-cta">تواصل معنا</a>
    </nav>
  </div>
</header>

<section class="cat-hero">
  <div class="wrap">
    <span class="crumb" id="crumb"></span>
    <h1 id="m-title">تحميل...</h1>
    <p id="m-sub"></p>
  </div>
</section>

<section style="padding-top:70px">
  <div class="wrap">
    <div class="products" id="colors"></div>
    <div class="cat-cta reveal">
      <a class="btn btn-wa" id="cta-wa" href="#" target="_blank" rel="noopener">استفسر عن هذا الموديل عبر واتساب</a>
    </div>
    <p style="text-align:center;margin-top:30px"><a id="back" href="index.html" style="color:var(--gold);font-weight:700">← العودة إلى القسم</a></p>
  </div>
</section>

<footer>
  <div class="logo"><img class="logo-img" src="images/logo-sand.svg" alt="درب"></div>
  <p>أحذية بالجملة والمفرق · حلب، سوريا</p>
  <p style="margin-top:10px">© 2026 درب. جميع الحقوق محفوظة</p>
</footer>

<a class="float-wa" id="float-wa" href="#" target="_blank" rel="noopener" aria-label="واتساب">💬</a>

<script src="catalog.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const section = params.get('s') === 'retail' ? 'retail' : 'wholesale';
  const index = parseInt(params.get('c'), 10) || 0;
  const mi = parseInt(params.get('m'), 10) || 0;
  const label = section === 'retail' ? 'المفرق' : 'الجملة';
  const cat = (CATALOG[section] || [])[index];
  const model = cat ? cat.models[mi] : null;

  document.getElementById('float-wa').href = waLink();

  if (!model) {
    document.getElementById('m-title').textContent = 'الموديل غير موجود';
    document.getElementById('m-sub').textContent = 'يمكنكم العودة إلى الصفحة الرئيسية لاختيار موديل آخر.';
    document.getElementById('cta-wa').href = waLink();
  } else {
    document.title = 'درب | ' + model.name + ' · ' + cat.name;
    document.getElementById('crumb').textContent = label + ' · ' + cat.name;
    document.getElementById('m-title').textContent = model.name;
    document.getElementById('m-sub').textContent =
      'اختاروا اللون الذي يناسبكم، والسعر يظهر تحت كل صورة';
    document.getElementById('back').href = 'category.html?s=' + section + '&c=' + index;
    document.getElementById('cta-wa').href = waLink(
      'مرحباً، أريد الاستفسار عن ' + label + ' - ' + cat.name + ' - ' + model.name
    );

    const wrap = document.getElementById('colors');
    model.colors.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'product reveal' + (i % 3 === 1 ? ' d1' : i % 3 === 2 ? ' d2' : '');

      const pimg = document.createElement('div');
      pimg.className = 'pimg';
      pimg.appendChild(makeImg(c.src, model.name + ' ' + c.name, c.name));
      card.appendChild(pimg);

      const body = document.createElement('div');
      body.className = 'pbody';
      body.innerHTML =
        '<h4>' + c.name + '</h4>' +
        '<div class="price' + (model.price ? '' : ' ask') + '">' + (model.price || 'السعر عند التواصل') + '</div>';
      const btn = document.createElement('a');
      btn.className = 'ask-btn';
      btn.href = waLink('مرحباً، أريد الاستفسار عن ' + cat.name + ' - ' + model.name + ' - اللون ' + c.name);
      btn.target = '_blank';
      btn.rel = 'noopener';
      btn.textContent = 'استفسر عن هذا اللون';
      body.appendChild(btn);
      card.appendChild(body);
      wrap.appendChild(card);
    });
  }

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  const header = document.querySelector('header');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 40));
</script>
</body>
</html>
