<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <g transform="translate(400, 400)">
    <!-- Outer Circular Emblem Arcs -->
    <path d="M -175 -110 A 205 205 0 0 1 175 -110" fill="none" stroke="#2B2420" stroke-width="16" stroke-linecap="round"/>
    <path d="M 185 85 A 205 205 0 0 1 -150 140" fill="none" stroke="#2B2420" stroke-width="16" stroke-linecap="round"/>
    <path d="M -195 45 A 205 205 0 0 1 -195 -45" fill="none" stroke="#2B2420" stroke-width="14" stroke-linecap="round"/>

    <!-- Flowing Terracotta Path Ribbon -->
    <path d="M -135 -10 C -75 -10, -45 -135, 45 -135 C 105 -135, 125 -95, 85 -75" fill="none" stroke="#C66B41" stroke-width="18" stroke-linecap="round"/>
    <!-- Parallel Dark Path Line -->
    <path d="M -135 -42 C -65 -42, -30 -105, 35 -105" fill="none" stroke="#2B2420" stroke-width="15" stroke-linecap="round"/>

    <!-- Bold Integrated Arabic Wordmark "درب" -->
    <g fill="none" stroke="#2B2420" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <!-- د -->
      <path d="M 85 -35 C 130 -35, 148 -10, 148 22 C 148 52, 122 68, 72 68"/>
      <!-- ر -->
      <path d="M 35 0 C 35 55, 10 98, -42 112"/>
      <!-- ب -->
      <path d="M -60 12 C -60 52, -85 68, -135 68 C -172 68, -188 48, -188 15"/>
    </g>
    <!-- Dot of ب -->
    <circle cx="-122" cy="105" r="13" fill="#2B2420"/>

    <!-- Lower Terracotta Stride Dashes -->
    <path d="M -65 148 C -20 152, 25 142, 65 122" fill="none" stroke="#C66B41" stroke-width="14" stroke-linecap="round" stroke-dasharray="32 22"/>
  </g>
</svg>